name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check release tag
        shell: pwsh
        run: |
          $version = python -c 'from gilhound import __version__; print(__version__)'
          if ($LASTEXITCODE -ne 0 -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'Release tag must match gilhound.__version__'
          }
      - run: python -m pip install -e ".[dev]"
      - run: |
          New-Item -ItemType Directory -Force .venv/tmp | Out-Null
          python -m pytest --basetemp .venv/tmp/pt -p no:cacheprovider
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: ./packaging/build.ps1
      - name: Publish archive and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes "dist/Gilhound-$version-win64.zip" dist/SHA256SUMS.txt


[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gilhound"
version = "0.1.0"
description = "Desktop FFXIV market-board scanner and position tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "httpx>=0.28.1",
    "pydantic==2.14.4",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
gilhound = "gilhound.cli:main"

[tool.setuptools.packages.find]
include = ["gilhound", "gilhound.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
